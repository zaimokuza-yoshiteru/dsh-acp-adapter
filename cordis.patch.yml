# @zaimokuza/dsh-acp-adapter bundle patch layer for the supported DSH host.
# The adapter is additive; the native AgentLoop and ModelPicker remain the default.
#
# This file becomes one patch layer when the package is listed in a profile's
# dsh.profile.bundles (`dsh plugin --profile <name> add <path>` reconciles it
# there). The Loader composes every bundle layer over the empty profile root in
# ONE applyEntryPatches call (vendor/include/src/index.ts:58), so the rows
# below address the stock rows inserted by @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-web-app.
#
- insert:
    - id: dsh-acp-adapter
      name: '@zaimokuza/dsh-acp-adapter'
      config: {}
    # An opt-in composition, independent of the profile-scoped ACP runtime.
    # No default, provider, model, or existing preset is changed here.
    - id: preset-acp-adapter
      name: '@deepseek-ai/dsh-agent-preset'
      inject: [dshAcp]
      config:
        id: acp-adapter
        name: ACP
        description: ''
        order: 5
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # Context compression and private planning belong to the external Agent.
          # Creator and delegated workflows remain available in the native presets.
