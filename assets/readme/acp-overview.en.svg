<text x="773" y="133" class="label" text-anchor="middle">request</text>
<path d="M798 221 Q773 227 748 222" class="pencil" marker-end="url(#arrow)"/>
<text x="773" y="248" class="label" text-anchor="middle">result</text>
<g transform="translate(30 323)">
