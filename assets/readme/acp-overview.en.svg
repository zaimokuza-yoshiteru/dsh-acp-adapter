<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title description" lang="en">
  <title id="title">Separate execution. Familiar interface.</title>
  <desc id="description">DSH owns sessions and native UI. The adapter forwards context and normalizes activity. The Agent runs models and tools. Permissions belong to the Agent, external subagent projections are read-only, and jobs do not survive a host restart.</desc>
  <style>
    text { fill:#29333b; font-family:'Chalkboard SE','Chalkboard','Comic Sans MS',sans-serif; }
    .title { font-size:29px; font-weight:600; }
    .heading { font-size:27px; font-weight:600; }
    .body { font-size:21px; }
    .note { font-size:20px; }
    .label { font-size:17px; fill:#687077; }
    .pencil { fill:none; stroke:#39444b; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#52626c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1160" height="470" rx="18" fill="#fffdf7"/>
  <text x="580" y="48" text-anchor="middle" class="title">Separate execution. Familiar interface.</text>
  <path d="M379 61 Q572 67 783 60" fill="none" stroke="#e8c778" stroke-width="5" stroke-linecap="round"/>

<g transform="translate(30 92)">
<path d="M4 3 Q162 -1 315 4 L319 182 Q160 187 2 181 Z" fill="#edf4f9" stroke="#39444b" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M0 9 L1 179 M9 187 Q164 190 312 185" class="pencil" opacity=".22"/>
<text x="160" y="47" text-anchor="middle" class="heading">DSH</text>
<path d="M65 61 Q160 64 254 60" class="pencil" opacity=".35"/>
<text x="160" y="100" text-anchor="middle" class="body">Sessions / AgentLoop</text>
<text x="160" y="136" text-anchor="middle" class="body">Input / messages / stop</text>
</g>
<g transform="translate(420 92)">
<path d="M4 3 Q162 -1 315 4 L319 182 Q160 187 2 181 Z" fill="#f2f0f8" stroke="#39444b" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M0 9 L1 179 M9 187 Q164 190 312 185" class="pencil" opacity=".22"/>
<text x="160" y="47" text-anchor="middle" class="heading">ACP adapter</text>
<path d="M65 61 Q160 64 254 60" class="pencil" opacity=".35"/>
<text x="160" y="100" text-anchor="middle" class="body">Host context → ACP</text>
<text x="160" y="136" text-anchor="middle" class="body">ACP activity → native UI</text>
</g>
<g transform="translate(810 92)">
<path d="M4 3 Q162 -1 315 4 L319 182 Q160 187 2 181 Z" fill="#eef5ee" stroke="#39444b" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M0 9 L1 179 M9 187 Q164 190 312 185" class="pencil" opacity=".22"/>
<text x="160" y="47" text-anchor="middle" class="heading">Agent</text>
<path d="M65 61 Q160 64 254 60" class="pencil" opacity=".35"/>
<text x="160" y="100" text-anchor="middle" class="body">Models / tools / permissions</text>
<text x="160" y="136" text-anchor="middle" class="body">Login / skills / MCP</text>
</g>
<path d="M358 149 Q383 144 408 149" class="pencil" marker-end="url(#arrow)"/>
<text x="383" y="133" class="label" text-anchor="middle">request</text>
<path d="M408 221 Q383 227 358 222" class="pencil" marker-end="url(#arrow)"/>
<text x="383" y="248" class="label" text-anchor="middle">result</text>
