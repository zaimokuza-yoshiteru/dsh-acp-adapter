<circle cx="15" cy="30" r="10" fill="#f7e7b5"/>
<path d="M10 29 l4 5 l8 -11" class="pencil"/>
<text x="39" y="37" class="heading" style="font-size:23px">Background jobs</text>
<text x="9" y="77" class="note">Processes created through ACP</text>
<text x="9" y="107" class="note">Not restored after DSH restart</text>
</g>
</svg>
