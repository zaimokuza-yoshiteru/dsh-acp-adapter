<circle cx="15" cy="30" r="10" fill="#f7e7b5"/>
<path d="M10 29 l4 5 l8 -11" class="pencil"/>
<text x="39" y="37" class="heading" style="font-size:23px">Approvals</text>
<text x="9" y="77" class="note">Custom = Agent permissions</text>
<text x="9" y="107" class="note">DSH shows ACP requests</text>
</g>
<g transform="translate(420 323)">
<path d="M10 0 Q154 -3 310 0" fill="none" stroke="#c3c8bd" stroke-width="2" stroke-linecap="round"/>
<circle cx="15" cy="30" r="10" fill="#f7e7b5"/>
