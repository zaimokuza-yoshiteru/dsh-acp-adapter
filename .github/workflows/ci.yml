name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Exact published rc.1 packages are the reproducible primary lane. The
# compatibility matrix verifies the declared floor and current npm prerelease; a
# separate source checkout verifies rc.1 through local links.
jobs:
  registry:
    name: ${{ matrix.os }} published rc.1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Install exact published dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # The persistence benchmark specs intentionally exercise SQLite with
      # 10k sequential writes. Running test files concurrently on Windows makes
      # those independent specs contend for the shared runner's filesystem and
      # turns the regression signal into runner-load noise.
      - name: Test (Windows, serial files)
        if: runner.os == 'Windows'
        run: pnpm test --no-file-parallelism
      - name: Test
        if: runner.os != 'Windows'
        run: pnpm test
      - name: Build and verify bundle
        run: pnpm build

  published-compatibility:
    name: published DSH ${{ matrix.dsh-version }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dsh-version: [0.1.2-alpha.4, next]
    env:
      DSH_COMPAT_VERSION: ${{ matrix.dsh-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Install reproducible toolchain
        run: pnpm install --frozen-lockfile
      - name: Select published DSH compatibility version
        run: |
          cp package.json "$RUNNER_TEMP/dsh-acp-release-package.json"
          pnpm update --dev "@deepseek-ai/dsh-*@$DSH_COMPAT_VERSION"
          cp "$RUNNER_TEMP/dsh-acp-release-package.json" package.json
      - name: Verify published compatibility
        run: pnpm typecheck && pnpm test && pnpm build

  source-compatibility:
    name: DSH rc.1 source compatibility
    runs-on: ubuntu-24.04
    env:
      DSH_UPSTREAM_CHECKOUT: ${{ github.workspace }}/reference/deepseek-harness
    steps:
      - uses: actions/checkout@v6
      - name: Checkout exact DSH source
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.2-rc.1
          path: reference/deepseek-harness
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Build DSH source
        run: pnpm install --frozen-lockfile && pnpm clean && pnpm build
        working-directory: reference/deepseek-harness
      - name: Install plugin tooling
        run: pnpm install --frozen-lockfile
      - name: Link and verify DSH source packages
        run: pnpm setup:source-reference && pnpm verify:source-reference && pnpm verify:source-install
      - name: Verify source compatibility
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Clean-install composition gate
        run: node scripts/install-gate.mjs --host-root "$DSH_UPSTREAM_CHECKOUT" --skip-boot
