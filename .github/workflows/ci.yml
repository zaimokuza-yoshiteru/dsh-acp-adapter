name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  published-compatibility:
    name: DSH 0.1.5 alpha npm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # pnpm 10's node-gyp supports VS 2022; windows-2025 now ships VS 18.
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Install exact published dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify npm compatibility
        run: pnpm typecheck && pnpm test --no-file-parallelism && pnpm build
      - name: Pack verified artifact
        id: artifact
        shell: bash
        run: echo "tarball=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_OUTPUT"
      - name: Published host install and boot
        if: runner.os != 'Windows'
        run: node scripts/install-gate.mjs --tgz "${{ steps.artifact.outputs.tarball }}"

  native-ui:
    name: Native UI parity (exact source scaffold)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dsh-acp-adapter
    env:
      DSH_UPSTREAM_CHECKOUT: ${{ github.workspace }}/reference/deepseek-harness
    steps:
      - uses: actions/checkout@v6
        with:
          path: dsh-acp-adapter
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.5-alpha.2
          path: reference/deepseek-harness
      - uses: actions/setup-node@v6
        with:
          node-version-file: dsh-acp-adapter/.nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: reference/deepseek-harness/package.json
      - name: Build exact host scaffold
        working-directory: reference/deepseek-harness
        run: pnpm install --frozen-lockfile && npm run build:native-system && npm run build:lib:host && npm run build:lib:client && npm --prefix apps/web run build
      - name: Install Chromium
        working-directory: reference/deepseek-harness
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
          package_json_file: dsh-acp-adapter/package.json
      - name: Build plugin with npm dependencies
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Native UI parity (keyless ACP protocol fixtures)
        run: pnpm test:e2e
