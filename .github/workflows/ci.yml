name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The alpha.2 CLI has not passed npm installation. Old registry host dependencies
# are no longer used: host development dependencies explicitly link to the source tag.
# Restore a published-package lane only after that artifact passes this suite.
jobs:
  source-compatibility:
    name: DSH alpha.2 source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-acp-adapter
    env:
      DSH_UPSTREAM_CHECKOUT: ${{ github.workspace }}/reference/deepseek-harness
    steps:
      - uses: actions/checkout@v6
        with:
          path: dsh-acp-adapter
      - name: Checkout exact DSH source
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.3-alpha.2
          path: reference/deepseek-harness
      - uses: actions/setup-node@v6
        with:
          node-version-file: dsh-acp-adapter/.nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
          package_json_file: dsh-acp-adapter/package.json
      - name: Build DSH source
        run: pnpm install --frozen-lockfile && pnpm clean && pnpm build
        working-directory: reference/deepseek-harness
      - name: Install pinned tools and declared source links
        run: pnpm install --frozen-lockfile
      - name: Link and verify DSH source packages
        run: pnpm setup:source-reference && pnpm verify:source-reference && pnpm verify:source-install
      - name: Verify source compatibility
        run: pnpm typecheck && pnpm test --no-file-parallelism && pnpm build
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: pnpm --dir ../reference/deepseek-harness/apps/web exec playwright install --with-deps chromium
      - name: Native UI parity (keyless ACP protocol fixtures)
        if: runner.os == 'Linux'
        run: pnpm test:e2e
      - name: Clean-install composition gate
        if: runner.os == 'Linux'
        run: node scripts/install-gate.mjs --host-root "$DSH_UPSTREAM_CHECKOUT" --skip-boot
