name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  published-compatibility:
    name: DSH npm compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # pnpm 10's node-gyp supports VS 2022; windows-2025 now ships VS 18.
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        if: runner.os != 'Windows'
        with:
          version: 10.7.0
      - name: Verify ordinary Unix user
        if: runner.os != 'Windows'
        run: node scripts/check-ci-user.mjs
      - name: Install exact published dependencies
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile
      - name: Verify npm compatibility
        if: runner.os != 'Windows'
        run: pnpm typecheck && pnpm test --no-file-parallelism && pnpm build
      - name: Install, verify and pack as an ordinary Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-windows-user-ci.ps1
      - name: Pack verified artifact
        if: runner.os != 'Windows'
        id: artifact
        shell: bash
        run: echo "tarball=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_OUTPUT"
      - name: Published host install and boot
        if: runner.os != 'Windows'
        run: node scripts/install-gate.mjs --tgz "${{ steps.artifact.outputs.tarball }}"

  native-ui:
    name: Native UI parity (exact source scaffold)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dsh-acp-adapter
    env:
      DSH_UPSTREAM_CHECKOUT: ${{ github.workspace }}/reference/deepseek-harness
    steps:
      - uses: actions/checkout@v6
        with:
          path: dsh-acp-adapter
      - name: Resolve exact DSH source tag
        id: dsh-target
        run: node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { DSH_SOURCE_TAG } from "./scripts/dsh-target.mjs"; appendFileSync(process.env.GITHUB_OUTPUT, `tag=${DSH_SOURCE_TAG}\n`)'
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.dsh-target.outputs.tag }}
          path: reference/deepseek-harness
      - uses: actions/setup-node@v6
        with:
          node-version-file: dsh-acp-adapter/.nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: reference/deepseek-harness/package.json
      - name: Verify ordinary Unix user
        run: node scripts/check-ci-user.mjs
      - name: Build exact host scaffold
        working-directory: reference/deepseek-harness
        run: pnpm install --frozen-lockfile && npm run build:native-system && npm run build:lib:host && npm run build:lib:client && npm --prefix apps/web run build
      - name: Install Chromium
        working-directory: reference/deepseek-harness
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Install native terminal sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces. Permit only
          # the sandbox launcher; keep the global AppArmor restriction enabled.
          sudo tee /etc/apparmor.d/dsh-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          profile dsh-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/dsh-ci-bwrap
          bwrap --ro-bind / / --dev /dev --proc /proc -- true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
          package_json_file: dsh-acp-adapter/package.json
      - name: Build plugin with npm dependencies
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Native UI parity (keyless ACP protocol fixtures)
        run: pnpm test:e2e
      - name: Upload native UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: dsh-acp-adapter/.local/e2e-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
