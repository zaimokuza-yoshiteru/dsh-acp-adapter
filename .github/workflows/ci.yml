name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Exact published alpha.4 packages are the reproducible primary lane. A
# separate source checkout verifies the same host version through local links.
jobs:
  registry:
    name: ${{ matrix.os }} published alpha.4
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Install exact published dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # The persistence benchmark specs intentionally exercise SQLite with
      # 10k sequential writes. Running test files concurrently on Windows makes
      # those independent specs contend for the shared runner's filesystem and
      # turns the regression signal into runner-load noise.
      - name: Test (Windows, serial files)
        if: runner.os == 'Windows'
        run: pnpm test --no-file-parallelism
      - name: Test
        if: runner.os != 'Windows'
        run: pnpm test
      - name: Build and verify bundle
        run: pnpm build

  source-compatibility:
    name: DSH alpha.4 source compatibility
    runs-on: ubuntu-24.04
    env:
      DSH_UPSTREAM_CHECKOUT: ${{ github.workspace }}/reference/deepseek-harness
    steps:
      - uses: actions/checkout@v6
      - name: Checkout exact DSH source
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.2-alpha.4
          path: reference/deepseek-harness
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Build DSH source
        run: pnpm install --frozen-lockfile && pnpm clean && pnpm build
        working-directory: reference/deepseek-harness
      - name: Install plugin tooling
        run: pnpm install --frozen-lockfile
      - name: Link and verify DSH source packages
        run: pnpm setup:source-reference && pnpm verify:source-reference && pnpm verify:source-install
      - name: Verify source compatibility
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Clean-install composition gate
        run: node scripts/install-gate.mjs --host-root "$DSH_UPSTREAM_CHECKOUT" --skip-boot
