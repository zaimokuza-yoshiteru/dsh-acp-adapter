# npm publishing is manual/tag-driven and uses the exact tarball produced by
# the published-package build lane. Trusted Publishing supplies OIDC.
name: publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  pack:
    name: Test, pack, and verify npm tarball
    runs-on: macos-15
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      tarball: ${{ steps.release.outputs.tarball }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Install exact published dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Verify release tag and version
        id: release
        run: node scripts/verify-release.mjs
      - name: Pack exact release artifact
        run: mkdir -p dist/npm && npm pack --pack-destination dist/npm
      - name: Verify expected artifact exists alone
        run: |
          test -f "dist/npm/${{ steps.release.outputs.tarball }}"
          test "$(find dist/npm -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-tarball
          path: dist/npm/${{ steps.release.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact tarball to npm
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: dist/npm
      - name: Publish with OIDC
        run: npm publish "dist/npm/${{ needs.pack.outputs.tarball }}" --access public --tag "${{ needs.pack.outputs.dist-tag }}"
