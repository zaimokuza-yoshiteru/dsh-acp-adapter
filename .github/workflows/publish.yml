# npm publishing is manual/tag-driven. Freeze the optional Registry refresh,
# then test and publish the same tarball. Trusted Publishing supplies OIDC.
name: publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  pack:
    name: Test, pack, and verify npm tarball
    runs-on: macos-15
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      tarball: ${{ steps.release.outputs.tarball }}
      registry-status: ${{ steps.registry.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - name: Verify release tag and version
        id: release
        run: node scripts/verify-release.ts
      - name: Verify ordinary Unix user
        run: node scripts/check-ci-user.mjs
      - name: Find frozen Registry input from an earlier attempt
        id: registry-checkpoint
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            })
            const checkpoint = artifacts.find(item => item.name === 'release-registry-snapshot')
            if (checkpoint?.expired) throw new Error('Frozen Registry artifact expired; start a new workflow run')
            return Boolean(checkpoint)
      - name: Restore frozen Registry input
        if: steps.registry-checkpoint.outputs.result == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-registry-snapshot
          path: .local/registry-release
      - name: Refresh Registry or retain validated fallback
        id: registry
        run: node scripts/sync-release-registry.ts --reuse
      - name: Freeze Registry input and change summary
        if: steps.registry-checkpoint.outputs.result != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-registry-snapshot
          path: .local/registry-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Install exact published dependencies
        run: pnpm install --frozen-lockfile
      # npm pack runs prepack: typecheck, tests, build and bundle verification once.
      - name: Test and pack exact release artifact
        run: mkdir -p dist/npm && npm pack --pack-destination dist/npm
      - name: Verify expected artifact exists alone
        run: |
          test -f "dist/npm/${{ steps.release.outputs.tarball }}"
          test "$(find dist/npm -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" = 1
      - name: Verify tarball against the published DSH host
        run: node scripts/install-gate.ts --tgz "dist/npm/${{ steps.release.outputs.tarball }}"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-tarball
          path: dist/npm/${{ steps.release.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  registry-notification:
    name: Report Registry fallback without blocking deployment
    needs: pack
    if: always() && needs.pack.outputs.registry-status == 'fallback'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: registry-fallback-issue
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-registry-snapshot
          path: .local/registry-release
      - uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/report-registry-sync.cjs')({ github, context, core })

  publish:
    name: Publish exact tarball to npm
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: dist/npm
      - name: Publish with OIDC
        run: |
          node scripts/check-ci-user.mjs
          npm publish "dist/npm/${{ needs.pack.outputs.tarball }}" --access public --tag "${{ needs.pack.outputs.dist-tag }}"

  github-release:
    name: Verify npm publication and create GitHub Release
    needs: [pack, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: dist/npm
      - name: Publish release notes for the verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.ts --tarball "dist/npm/${{ needs.pack.outputs.tarball }}" --write
      - name: Preserve generated release notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-release-notes
          path: .local/releases/*.md
          if-no-files-found: ignore
          retention-days: 90
